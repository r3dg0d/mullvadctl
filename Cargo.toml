[package]
name = "mullvadctl"
version = "0.1.0"
edition = "2021"
authors = ["r3dg0d <r3dg0d@users.noreply.github.com>"]
description = "Companion CLI helper for Mullvad VPN — never replaces or weakens Mullvad security"
license = "MIT"
repository = "https://github.com/r3dg0d/mullvadctl"
homepage = "https://github.com/r3dg0d/mullvadctl"
documentation = "https://docs.rs/mullvadctl"
readme = "README.md"
keywords = ["mullvad", "vpn", "privacy", "opsec", "cli"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.75"

[[bin]]
name = "mullvadctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
ctrlc = "3.4"
directories = "5"
rand = "0.8"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "2.12", default-features = true, features = ["json"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
